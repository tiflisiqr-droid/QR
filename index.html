<!DOCTYPE html>
<html lang="ka">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Montserrat:wght@400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Montserrat:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Montserrat:wght@400;500;600;700&display=swap"
      />
    </noscript>
    <meta name="theme-color" content="#0a0a0c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Tiflisi Georgian Restaurant — digital menu. Scan the QR, choose your language, explore dishes." />
    <!-- Link previews (WhatsApp/Facebook/Telegram). Absolute URL required; dish-specific cards need a server. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tiflisi" />
    <meta property="og:title" content="Tiflisi — Digital Menu" />
    <meta property="og:description" content="Georgian fine dining digital menu — open a dish and share with friends." />
    <meta property="og:url" content="https://tiflisiqr-droid.github.io/QR/" />
    <meta property="og:image" content="https://tiflisiqr-droid.github.io/QR/og-image.png" />
    <meta property="og:image:alt" content="Tiflisi Georgian Restaurant" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tiflisi — Digital Menu" />
    <meta name="twitter:description" content="Georgian fine dining digital menu." />
    <meta name="twitter:image" content="https://tiflisiqr-droid.github.io/QR/og-image.png" />
    <style>
      html, body, #root {
        background: #020506;
        min-height: 100%;
      }
    </style>
    <title>Tiflisi — Digital Menu</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
